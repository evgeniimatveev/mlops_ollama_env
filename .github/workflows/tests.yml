name: Tests

# Automatic and fast: the API tests use a fake Ollama, so no model and no network are needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: pytest
        run: uv run --no-project --python 3.12 --with-requirements requirements-dev.txt python -m pytest -q
